<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SSC Poly – Staff Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f0f4f8;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .nav-panel {
      width: 230px;
      background: #2c5364;
      color: white;
    }

    .nav-header {
      padding: 20px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .nav-menu a {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      background: rgba(255,255,255,0.15);
      border-left: 4px solid #38ef7d;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2c5364;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .content {
      padding: 25px;
    }

    .hidden {
      display: none;
    }

    h2 {
      color: #2c5364;
    }

    /* Cards */
    .dashboard-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: linear-gradient(135deg, #f46b45, #eea849);
      color: white;
      padding: 25px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
    }

    .card:hover {
      opacity: 0.9;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #2c5364;
      color: white;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .nav-panel {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <div class="nav-panel">
    <div class="nav-header">SSC Poly Staff</div>
    <div class="nav-menu">
      <a href="#" class="active" onclick="showSection('home')">🏠 Home</a>
      <a href="#" onclick="showSection('profile')">👤 Profile</a>
      <a href="#" onclick="showSection('duties'); loadMyDuties();">✅ My Duties</a>
      <a href="#" onclick="logout()">🚪 Logout</a>
    </div>
  </div>

  <!-- Main -->
  <div class="main-content">

    <header>
      <div>Welcome, <strong id="username"></strong></div>
      <button onclick="logout()">Logout</button>
    </header>

    <div class="content">

      <!-- Home -->
      <div id="home-section">
        <h2>Dashboard</h2>
        <div class="dashboard-cards">
          <div class="card" onclick="showSection('duties'); loadMyDuties()">
            👨‍🏫<br><br>
            <strong>My Scheduled Duties</strong>
          </div>
        </div>
      </div>

      <!-- Profile -->
      <div id="profile-section" class="hidden">
        <h2>My Profile</h2>
        <p><b>Name:</b> <span id="p-name"></span></p>
        <p><b>Staff ID:</b> <span id="p-id"></span></p>
        <p><b>Role:</b> <span id="p-role"></span></p>
        <p><b>Designation:</b> <span id="p-des"></span></p>
        <p><b>Department:</b> <span id="p-dep"></span></p>
      </div>

      <!-- Duties -->
      <div id="duties-section" class="hidden">
  <h2>My Scheduled Duties</h2>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Session</th>
        <th>Duty</th>
      </tr>
    </thead>
    <tbody id="dutiesTable">
      <tr><td colspan="3">Loading...</td></tr>
    </tbody>
  </table>
</div>

    </div>
  </div>

<script>
/* ---------- AUTH CHECK ---------- */
document.addEventListener("DOMContentLoaded", () => {
  const staffName = sessionStorage.getItem("staffName");
  if (!staffName) {
    alert("Session expired. Please login again.");
    window.location.href = "login.html";
    return;
  }

  document.getElementById("username").textContent = staffName;
  document.getElementById("p-name").textContent = staffName;
  document.getElementById("p-id").textContent = sessionStorage.getItem("staffId");
  document.getElementById("p-role").textContent = sessionStorage.getItem("role");
  document.getElementById("p-des").textContent = sessionStorage.getItem("designation");
  document.getElementById("p-dep").textContent = sessionStorage.getItem("department");
});

/* ---------- NAV ---------- */
function showSection(section) {
  document.querySelectorAll(".content > div").forEach(d => d.classList.add("hidden"));
  document.getElementById(section + "-section").classList.remove("hidden");
}

/* ---------- LOGOUT ---------- */
function logout() {
  sessionStorage.clear();
  localStorage.removeItem("staffData");
  window.location.href = "login.html";
}

/* ---------- LOAD DUTIES ---------- */
async function loadMyDuties() {
  const staffId = sessionStorage.getItem("staffId");
  const table = document.getElementById("dutiesTable");
  table.innerHTML = "<tr><td colspan='3'>Loading...</td></tr>";

  try {
    const res = await fetch(
      "https://script.google.com/macros/s/AKfycbxYkfcqKCvpMOQF0NwGBJwHfuq-jINYJ_mjFEU0VwSBfL26E9C6sRdJ5c1zFZOUdwMq/exec?staffId=" + staffId
    );
    const data = await res.json();

    table.innerHTML = "";

    if (data.length === 0) {
      table.innerHTML = "<tr><td colspan='3'>No duties assigned</td></tr>";
      return;
    }

    data.forEach(d => {
      table.innerHTML += `
        <tr>
          <td>${d.date}</td>
          <td>${d.session}</td>
          <td>${d.duty}</td>
        </tr>`;
    });

  } catch (e) {
    table.innerHTML = "<tr><td colspan='3'>Error loading duties</td></tr>";
  }
}
</script>

</body>
</html>
``
