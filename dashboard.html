<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard</title>

<style>
/* ===== SAME YOUR STYLING + ADDITIONS ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-color: #f0f4f8;
  display: flex;
  min-height: 100vh;
}

.nav-panel {
  width: 250px;
  background-color: #2c5364;
  color: white;
}

.nav-menu a {
  display: flex;
  padding: 12px 20px;
  color: white;
  text-decoration: none;
}

.nav-menu a.active {
  background-color: rgba(255,255,255,0.2);
}

.main-content {
  flex: 1;
}

header {
  background-color: #2c5364;
  color: white;
  padding: 15px;
  text-align: right;
}

.content {
  padding: 20px;
}

.hidden {
  display: none;
}

/* ===== DUTIES UI ===== */
.duty-card {
  background: white;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.badge {
  padding: 4px 8px;
  border-radius: 5px;
  color: white;
  font-size: 12px;
}

/* Color Coding */
.S { background: green; }
.R { background: blue; }
.IS { background: purple; }
.C { background: orange; }

</style>
</head>

<body>

<!-- NAV -->
<div class="nav-panel">
  <div class="nav-menu">
    <a href="#" onclick="showSection('home')" class="active">🏠 Home</a>
    <a href="#" onclick="showSection('profile')">👤 Profile</a>
    <a href="#" onclick="showSection('duties'); loadDuties();">✅ My Duties</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>
</div>

<!-- MAIN -->
<div class="main-content">
  <header>
    Welcome, <span id="username"></span>
    <button onclick="logout()">Logout</button>
  </header>

  <div class="content">

    <!-- HOME -->
    <div id="home-section">
      <h2>Welcome, <span id="welcome-name"></span></h2>
      <p>Dashboard Home</p>
    </div>

    <!-- PROFILE -->
    <div id="profile-section" class="hidden">
      <h2>My Profile</h2>
      <p>Name: <span id="name"></span></p>
      <p>Role: <span id="role"></span></p>
      <p>ID: <span id="id"></span></p>
      <p>Designation: <span id="des"></span></p>
      <p>Department: <span id="dep"></span></p>
    </div>

    <!-- DUTIES -->
    <div id="duties-section" class="hidden">
      <h2>My Duties</h2>
      <div id="duties-list"></div>
    </div>

  </div>
</div>

<script>

// ========================
// SESSION DATA
// ========================
const staffName = sessionStorage.getItem("staffName");
const staffId = sessionStorage.getItem("staffId");
const role = sessionStorage.getItem("role");
const designation = sessionStorage.getItem("designation");
const department = sessionStorage.getItem("department");

if (!staffName) {
  window.location.href = "login.html";
}

// Fill data
document.getElementById("username").textContent = staffName;
document.getElementById("welcome-name").textContent = staffName;
document.getElementById("name").textContent = staffName;
document.getElementById("role").textContent = role;
document.getElementById("id").textContent = staffId;
document.getElementById("des").textContent = designation;
document.getElementById("dep").textContent = department;


// ========================
// NAVIGATION
// ========================
function showSection(section) {
  document.querySelectorAll('.content > div').forEach(div => {
    div.classList.add('hidden');
  });

  document.getElementById(section + '-section').classList.remove('hidden');
}


// ========================
// LOGOUT
// ========================
function logout() {
  sessionStorage.clear();
  localStorage.clear();
  window.location.href = "login.html";
}


// ========================
// LOAD DUTIES
// ========================
async function loadDuties() {

  const response = await fetch("https://script.google.com/macros/s/AKfycbzTjvR6A6qSmdwgmJCIZrLxM4Z6muI0LUaM7rikugaXx_iSaWX3YMxt0nFdPx9UwCUy/exec", {
    method: "POST",
    body: new URLSearchParams({
      action: "getDuties",
      staffId: staffId
    })
  });

  const result = await response.json();
  const container = document.getElementById("duties-list");

  container.innerHTML = "";

  if (!result.duties || result.duties.length === 0) {
    container.innerHTML = "<p>No duties assigned</p>";
    return;
  }

  result.duties.forEach(d => {

    let dutyName = "";
    if (d.duty === "S") dutyName = "Supervision";
    else if (d.duty === "R") dutyName = "Reliever";
    else if (d.duty === "IS") dutyName = "Internal Squad";
    else if (d.duty === "C") dutyName = "Controller";

    container.innerHTML += `
      <div class="duty-card">
        <b>Date:</b> ${d.date}<br>
        <b>Session:</b> ${d.session}<br>
        <b>Duty:</b> <span class="badge ${d.duty}">${dutyName}</span>
      </div>
    `;
  });
}

</script>

</body>
</html>
